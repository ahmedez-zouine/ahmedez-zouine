  <!-- Global fade-out wrapper -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.873;0.927;0.98;1" dur="11.0s" repeatCount="indefinite"/>
  <g clip-path="url(#c0)">
    <text xml:space="preserve" x="10" y="20" class="cm">// Think. Code. Simulate.</text>
  </g>
  <g clip-path="url(#c1)">
    <text xml:space="preserve" x="10" y="44" class="b">while (<tspan class="g">curiosity</tspan>) {</text>
  </g>
  <g clip-path="url(#c2)">
    <text xml:space="preserve" x="10" y="68" class="b">    <tspan class="g">explore()</tspan>;</text>
  </g>
  <g clip-path="url(#c3)">
    <text xml:space="preserve" x="10" y="92" class="b">    #pragma omp parallel for</text>
  </g>
  <g clip-path="url(#c4)">
    <text xml:space="preserve" x="10" y="116" class="b">    for (int i = 0; i &lt; N; ++i) {</text>
  </g>
  <g clip-path="url(#c5)">
    <text xml:space="preserve" x="10" y="140" class="b">        <tspan class="g">solve(i)</tspan>;</text>
  </g>
  <g clip-path="url(#c6)">
    <text xml:space="preserve" x="10" y="164" class="b">    }</text>
  </g>
  <g clip-path="url(#c7)">
    <text xml:space="preserve" x="10" y="188" class="b">    <tspan class="g">learn()</tspan>;</text>
  </g>
  <g clip-path="url(#c8)">
    <text xml:space="preserve" x="10" y="212" class="b">}</text>
  </g>

    <!-- Blinking cursor at closing brace -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.559;0.559;0.873;0.927;1" dur="11.0s" repeatCount="indefinite"/>
      <rect class="cursor" x="22" y="199" width="2" height="16"/>
    </g>
  </g>
