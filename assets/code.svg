<svg xmlns="http://www.w3.org/2000/svg" width="500" height="230" viewBox="0 0 500 230">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;display=swap');

      text {
        font-family: 'Fira Code', 'FiraCode-Regular', Menlo, Monaco, Consolas, 'Courier New', monospace;
        font-size: 16px;
        font-feature-settings: "liga" on, "calt" on;
        -webkit-font-smoothing: antialiased;
      }

      .b  { fill: #2a98eb; }
      .g  { fill: #2ecc71; }
      .cm { fill: #6b7280; }

      .cursor {
        fill: #2a98eb;
        animation: blink 0.8s step-end infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>

    <clipPath id="c0">
      <rect x="0" y="4" width="0" height="24">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0.0;0.027;0.095;0.873;0.927;1.0" dur="11.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="c1">
      <rect x="0" y="28" width="0" height="24">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0.0;0.109;0.161;0.873;0.927;1.0" dur="11.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="0" y="52" width="0" height="24">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0.0;0.173;0.211;0.873;0.927;1.0" dur="11.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="c3">
      <rect x="0" y="76" width="0" height="24">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0.0;0.227;0.304;0.873;0.927;1.0" dur="11.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="c4">
      <rect x="0" y="100" width="0" height="24">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0.0;0.318;0.408;0.873;0.927;1.0" dur="11.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="c5">
      <rect x="0" y="124" width="0" height="24">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0.0;0.418;0.465;0.873;0.927;1.0" dur="11.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="c6">
      <rect x="0" y="148" width="0" height="24">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0.0;0.482;0.495;0.873;0.927;1.0" dur="11.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="c7">
      <rect x="0" y="172" width="0" height="24">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0.0;0.509;0.542;0.873;0.927;1.0" dur="11.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="c8">
      <rect x="0" y="196" width="0" height="24">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0.0;0.555;0.557;0.873;0.927;1.0" dur="11.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
